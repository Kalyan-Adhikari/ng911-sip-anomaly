[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ng911-sip-anomaly"
version = "0.1.0"
description = "SIP traffic anomaly detection for NG911 ESInet captures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kalyan Adhikari", email = "kalyanadhikari@tamu.edu" }]
keywords = ["ng911", "sip", "anomaly-detection", "network-security", "esinet"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

# Upper bounds are deliberate: model artifacts are pickles tied to the
# estimator classes that produced them, so a major version jump in
# scikit-learn or pyod can silently invalidate a saved detector.
dependencies = [
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<4.0",
    "scikit-learn>=1.3,<2.0",
    "pyod>=1.1,<3.0",
    "joblib>=1.3,<2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
# Only needed for pcapng and exotic link types; the fast reader covers classic
# pcap, which is what tcpdump and dumpcap write by default.
formats = ["scapy>=2.5,<3.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.scripts]
ng911-sip = "ng911_sip.cli:main"

[project.urls]
Repository = "https://github.com/Kalyan-Adhikari/ng911-sip-anomaly"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
